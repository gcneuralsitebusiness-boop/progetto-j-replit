              schema: { $ref: "#/components/schemas/ObiettivoTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /task/{id}:
    delete:
      operationId: deleteObiettivoTask
      tags: [obiettivi]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /task/{id}/completa:
    post:
      operationId: completaObiettivoTask
      tags: [obiettivi]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompletaTaskInput" }
      responses:
        "200":
          description: Toggled task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObiettivoTask" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /giorni/{numero}/task:
    get:
      operationId: listTaskGiorno
      tags: [obiettivi]
      parameters:
        - name: numero
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Tasks completed on a day
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskGiorno" }
  /coaching:
    get:
      operationId: getCoaching
      tags: [coaching]
      summary: Get coaching landing content
      responses:
        "200":
          description: Coaching content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coaching"
    put:
      operationId: updateCoaching
      tags: [coaching]
      summary: Update coaching content (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoachingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coaching"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/planner/annotation:
    get:
      operationId: getPlannerAnnotation
      parameters:
        - in: query
          name: data
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Daily private annotation and preserved legacy notes
          content:
