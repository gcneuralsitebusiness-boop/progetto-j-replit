      type: object
      required: [obiettivo, task]
      properties:
        obiettivo: { $ref: "#/components/schemas/ObiettivoBase" }
        task:
          type: array
          items: { $ref: "#/components/schemas/ObiettivoTask" }
    TappaCorrente:
      type: object
      required: [id, ciclo, numero, giornoInizio, giornoFine, chiusa, nota, obiettivi]
      properties:
        id: { type: integer }
        ciclo: { type: integer }
        numero: { type: integer }
        giornoInizio: { type: integer }
        giornoFine: { type: integer }
        chiusa: { type: boolean }
        nota: { type: [string, "null"] }
        obiettivi:
          type: array
          items: { $ref: "#/components/schemas/TappaTaskGroup" }
    TappaPrecedente:
      type: object
      required: [numero, task_fatti, task_totali]
      properties:
        numero: { type: integer }
        task_fatti: { type: integer }
        task_totali: { type: integer }
    ObiettivoBase:
      type: object
      required: [id, ciclo, posizione, area, titolo, previsto, giornoLimite, prova, stato]
      properties:
        id: { type: integer }
        ciclo: { type: integer }
        posizione: { type: integer }
        area: { type: string, enum: [CORPO, CONTENUTI, SOLDI] }
        titolo: { type: string, maxLength: 60 }
        previsto: { type: integer }
        giornoLimite: { type: integer }
        prova: { type: [string, "null"] }
        stato: { type: string, enum: [attivo, compiuto, fallito] }
    Obiettivo:
      allOf:
        - $ref: "#/components/schemas/ObiettivoBase"
        - type: object
          required: [fatto, tappa_corrente, tappe_precedenti]
          properties:
            fatto: { type: integer, readOnly: true }
            tappa_corrente:
              anyOf:
                - type: "null"
                - type: object
                  required: [numero, giorno_inizio, giorno_fine, task]
                  properties:
                    numero: { type: integer }
                    giorno_inizio: { type: integer }
                    giorno_fine: { type: integer }
                    task:
                      type: array
                      items: { $ref: "#/components/schemas/ObiettivoTask" }
            tappe_precedenti:
              type: array
              items: { $ref: "#/components/schemas/TappaPrecedente" }
    ObiettivoUpdate:
      type: object
      required: [area, titolo, previsto, giorno_limite, prova, stato]
      properties:
        area: { type: string, enum: [CORPO, CONTENUTI, SOLDI] }
        titolo: { type: string, minLength: 1, maxLength: 60 }
        previsto: { type: integer, minimum: 1 }
        giorno_limite: { type: integer, minimum: 1 }
        prova: { type: [string, "null"] }
        stato: { type: string, enum: [attivo, compiuto, fallito] }
    NuovaTappaTasks:
      type: object
      required: [obiettivo_id, task]
      properties:
        obiettivo_id: { type: integer, minimum: 1 }
        task:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 80 }
    ChiudiTappaInput:
      type: object
      required: [nota, nuove_tappe]
      properties:
        nota: { type: string, minLength: 1 }
        nuove_tappe:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/NuovaTappaTasks" }
