openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Progetto J — 180-day transformation journal
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Journal entries
  - name: admin
    description: Admin authentication
  - name: content
    description: Site content (CMS)
  - name: pages
    description: Custom pages (CMS)
  - name: storage
    description: Object storage upload and serving
  - name: candidature
    description: Candidature al programma coaching
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /live:
    get:
      operationId: getLive
      tags: [live]
      summary: Stato corrente, programma e sensore
      responses:
        "200":
          description: Attività corrente e programma giornaliero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatus"

  /admin/live/programma:
    get:
      operationId: getLiveSchedule
      tags: [live]
      summary: Programma settimanale (solo admin)
      responses:
        "200":
          description: Intervalli settimanali
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveScheduleItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: saveLiveSchedule
      tags: [live]
      summary: Salva il programma settimanale (solo admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveProgramRequest"
      responses:
        "200":
          description: Programma salvato
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveScheduleItem"
        "400":
          description: Programma non valido
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/live/override:
    put:
      operationId: setLiveOverride
      tags: [live]
      summary: Imposta un override per tre ore (solo admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveOverrideRequest"
      responses:
        "200":
          description: Override attivo
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: clearLiveOverride
      tags: [live]
      summary: Torna al programma settimanale (solo admin)
      responses:
        "200":
          description: Override cancellato
        "401":
          $ref: "#/components/responses/Unauthorized"

  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List all journal entries
      description: Returns all entries sorted by date descending
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a new journal entry (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Entry with this numero already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /entries/light:
    get:
      operationId: listLightEntries
      tags: [entries]
      summary: Public journal metrics without diary bodies or generated card media
      responses:
        "200":
          description: Lightweight entries sorted by date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryLight"

  /entries/latest:
    get:
      operationId: getLatestEntries
      tags: [entries]
      summary: Get 3 most recent journal entries
      description: Returns the 3 most recent entries for the home page
      responses:
        "200":
          description: Latest entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"

  /entries/summary:
    get:
      operationId: listEntrySummaries
      tags: [entries]
      summary: List lightweight journal entry summaries
      description: Returns the fields needed by feeds and planning without full entry metadata
      responses:
        "200":
          description: Lightweight entry summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntrySummary"

  /bulk/entries:
    get:
      operationId: getEntriesBulkText
      tags: [entries]
      summary: Export all entries as editable text
      description: Returns a text representation of all entries for bulk editing
      responses:
        "200":
          description: Bulk text export
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: importEntriesBulkText
      tags: [entries]
      summary: Import entries from editable text
      description: Parses bulk text and updates existing entries. Only updates entries that already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTextInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTextResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /entries/{numero}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get one complete journal entry
      parameters:
        - name: numero
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complete journal entry
          headers:
            ETag:
              description: Strong revision identifier for conditional updates
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Entry not found
    patch:
      operationId: updateEntry
      tags: [entries]
      summary: Update a journal entry (admin only)
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Update only if the current entry has this revision; otherwise return 412 without changing data
          schema:
            type: string
        - name: numero
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "412":
          description: Entry changed since it was reviewed; no changes applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete a journal entry (admin only)
      parameters:
        - name: numero
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /content:
    get:
      operationId: getSiteContent
      tags: [content]
      summary: Get all site content key-values
      responses:
        "200":
          description: Site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"

  /content/{chiave}:
    put:
      operationId: updateSiteContent
      tags: [content]
      summary: Update a site content key (admin only)
      parameters:
        - name: chiave
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInput"
      responses:
        "200":
          description: Updated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pages:
    get:
      operationId: listPages
      tags: [pages]
      summary: List all custom pages
      responses:
        "200":
          description: List of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageItem"
    post:
      operationId: createPage
      tags: [pages]
      summary: Create a custom page (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageInput"
      responses:
        "201":
          description: Created page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /pages/{slug}:
    get:
      operationId: getPage
      tags: [pages]
      summary: Get a single custom page by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePage
      tags: [pages]
      summary: Update a custom page (admin only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageUpdate"
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deletePage
      tags: [pages]
      summary: Delete a custom page (admin only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Authenticate as admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Log out admin session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Check current admin session
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /social:
    get:
      operationId: listSocial
      tags: [social]
      summary: List public social profiles
      responses:
        "200":
          description: List of social profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Social"
    post:
      operationId: createSocial
      tags: [social]
      summary: Create social profile (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Social"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /social/{id}:
    put:
      operationId: updateSocial
      tags: [social]
      summary: Update social profile (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Social"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSocial
      tags: [social]
      summary: Delete social profile (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors]
      summary: List public sponsors
      responses:
        "200":
          description: List of sponsors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sponsor"
    post:
      operationId: createSponsor
      tags: [sponsors]
      summary: Create sponsor (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sponsors/{id}:
    put:
      operationId: updateSponsor
      tags: [sponsors]
      summary: Update sponsor (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSponsor
      tags: [sponsors]
      summary: Delete sponsor (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List public articles
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: publishedOnly
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [articles]
      summary: Create article (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /articles/{slug}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get public article by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          $ref: "#/components/responses/NotFound"
  /articles/{id}:
    put:
      operationId: updateArticle
      tags: [articles]
      summary: Update article (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete article (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  /candidature:
    get:
      operationId: listCandidature
      tags: [candidature]
      summary: List coaching candidature (admin only)
      responses:
        "200":
          description: Candidature
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidatura"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCandidatura
      tags: [candidature]
      summary: Submit a coaching candidatura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidaturaInput"
      responses:
        "201":
          description: Candidatura submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidatura"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /candidature/{id}:
    patch:
      operationId: updateCandidatura
      tags: [candidature]
      summary: Update a coaching candidatura status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidaturaUpdate"
      responses:
        "200":
          description: Updated candidatura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidatura"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Candidatura not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /obiettivi:
    get:
      operationId: listObiettivi
      tags: [obiettivi]
      responses:
        "200":
          description: Active cycle goals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Obiettivo" }
  /obiettivi/{id}:
    put:
      operationId: updateObiettivo
      tags: [obiettivi]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObiettivoUpdate" }
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Obiettivo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tappe/corrente:
    get:
      operationId: getTappaCorrente
      tags: [obiettivi]
      responses:
        "200":
          description: Current stage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TappaCorrente" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tappe/{id}/chiudi:
    post:
      operationId: chiudiTappa
      tags: [obiettivi]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChiudiTappaInput" }
      responses:
        "201":
          description: Next stage created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TappaCorrente" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /task:
    post:
      operationId: createObiettivoTask
      tags: [obiettivi]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ObiettivoTaskInput" }
      responses:
