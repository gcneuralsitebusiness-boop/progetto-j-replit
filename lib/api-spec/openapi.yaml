    LiveOverrideRequest:
      type: object
      required: [attivita]
      properties:
        attivita: { type: string, enum: [SONNO, LAVORO, ALLENAMENTO, LIBERO] }
    LiveScheduleInput:
      type: object
      required: [giorno, inizio, fine, attivita]
      properties:
        giorno: { type: integer, minimum: 0, maximum: 6 }
        inizio: { type: string, pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$' }
        fine: { type: string, pattern: '^(?:(?:[01][0-9]|2[0-3]):[0-5][0-9]|24:00)$' }
        attivita: { type: string, enum: [SONNO, LAVORO, ALLENAMENTO, LIBERO] }
    LiveScheduleItem:
      allOf:
        - $ref: "#/components/schemas/LiveScheduleInput"
        - type: object
          required: [id]
          properties:
            id: { type: integer }
    LiveStatus:
      type: object
      required: [attivita, nome, da, sensore, ora, giorno, programma, overrideFino]
      properties:
        attivita: { type: string, enum: [SONNO, LAVORO, ALLENAMENTO, LIBERO] }
        nome: { type: string }
        da: { type: string }
        prossima:
          anyOf:
            - type: "null"
            - type: object
              required: [attivita, nome, inizio]
              properties:
                attivita: { type: string }
                nome: { type: string }
                inizio: { type: string }
        sensore: { type: string, enum: [offline] }
        ora: { type: string }
        giorno: { type: integer, minimum: 0, maximum: 6 }
        programma:
          type: array
          items: { $ref: "#/components/schemas/LiveScheduleItem" }
        overrideFino:
          anyOf:
            - type: "null"
            - type: string
              format: date-time
